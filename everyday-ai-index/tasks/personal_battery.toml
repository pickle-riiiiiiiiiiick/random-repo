# Personal task battery (Layer C).
#
# REPLACE THESE with tasks from your own life. Good tasks are:
#   - things you actually needed done in the last month
#   - checkable: you can tell whether the result is right
#   - a mix of lengths (5 minutes -> 1 hour of human effort)
#   - fixed: same prompt and same input files for every setup
#
# importance: 1 = nice to have, 2 = normal, 3 = high stakes
# human_minutes: roughly how long it would take YOU without AI (tracks task difficulty over time)
# status: active | retired (retire after every setup passes it twice in a row)
#
# Growth rule: whenever an AI fails something you really needed, add it here.

[[tasks]]
id = "T01"
title = "Reply to a formal letter"
prompt = "Here's a letter I received [attach]. Summarise what they want, any deadlines, and draft a polite but firm reply."
category = "writing"
importance = 3
human_minutes = 45
status = "active"

[[tasks]]
id = "T02"
title = "Trip plan with a real budget"
prompt = "Plan a 4-day trip to [city] for two in [month]: daily plan, rough costs, and a spreadsheet I can edit."
category = "planning"
importance = 2
human_minutes = 90
status = "active"

[[tasks]]
id = "T03"
title = "Spreadsheet analysis"
prompt = "Here's my expenses export [attach CSV]. Categorise it, show the top 5 categories by month, and flag anything unusual."
category = "data"
importance = 2
human_minutes = 60
status = "active"

